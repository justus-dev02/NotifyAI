# CI für NotifyAI auf einer Mac-Maschine von GitHub (GitHub-hosted Runner). Für öffentliche
# Repositories ist das kostenlos; der eigene Mac wird nicht gebraucht. Kosten und Sicherheit:
# docs/CI.md
#
# Alle Schritte stehen in scripts/ci.sh und lassen sich lokal genauso ausführen.

name: CI

# Pull Requests, auch aus Forks, werden ebenfalls geprüft: Jeder Lauf bekommt eine frische,
# isolierte Maschine, ein Token nur mit Leserechten und keine Secrets.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'release-notes/**', 'appcast.xml', 'docs/**', 'website/**', 'design/**']
  pull_request:
    paths-ignore: ['**.md', 'release-notes/**', 'appcast.xml', 'docs/**', 'website/**', 'design/**']
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer Push auf denselben Branch bricht den alten Lauf ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dieselbe Xcode-Version wie lokal (27A266a). Das Image „xcode-27“ hat 27.0, 27.1 und 27.2;
  # Standard ist dort 27.1. Beim Wechsel auf eine neue Xcode-Version hier und lokal anpassen.
  XCODE_VERSION: '27.0'
  # SwiftLint fest auf die lokale Version, damit neue Regeln einer neueren Version die CI nicht
  # unbemerkt rot machen. Prüfsumme aus dem GitHub-Release.
  SWIFTLINT_VERSION: '0.65.1'
  SWIFTLINT_SHA256: 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0'

jobs:
  ci:
    name: Lint, Tests, Builds
    # Xcode 27 gibt es auf GitHub nur im Image „xcode-27“ (Public Preview, Apple Silicon).
    # „macos-26“ hat nur Xcode 26. Nicht „xcode-27-xlarge“ nehmen: Größere Runner kosten immer.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Xcode ${{ env.XCODE_VERSION }}
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$app" ]]; then
              echo "::error::Xcode $XCODE_VERSION fehlt im Runner-Image. Vorhanden:"
              ls -d /Applications/Xcode_*.app
              exit 1
          fi
          sudo xcode-select --switch "$app"
          xcodebuild -version

      - name: Werkzeuge – SwiftLint, ShellCheck, actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
              "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install shellcheck actionlint
          "$RUNNER_TEMP/bin/swiftlint" version

      # Build-Cache: DerivedData (mit den Swift-Paketen und ihren fertig gebauten Modulen) und der
      # Build-Ordner der Paket-Tests. Gespeichert wird nur auf main; Pull Requests lesen ihn nur.
      # Der Schlüssel enthält die Xcode-Version und die Paketstände: Ändert sich eins davon, beginnt
      # ein neuer Cache. Der Actions-Cache ist für öffentliche Repositories kostenlos (bis 10 GB).
      - name: Build-Cache laden
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/ci/DerivedData
            build/ci/package-build
          key: ci-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('**/Package.resolved') }}-${{ github.run_id }}
          restore-keys: |
            ci-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('**/Package.resolved') }}-

      - name: SwiftLint, ShellCheck, actionlint
        run: scripts/ci.sh lint

      # Die weiteren Schritte laufen auch, wenn ein vorheriger fehlschlägt, damit alle Fehler auf
      # einmal sichtbar sind.
      - name: Veröffentlichung – Plists, Icons, Export-Optionen, Website
        if: ${{ !cancelled() }}
        run: scripts/ci.sh dist

      - name: Tests – NotifyAIKit
        if: ${{ !cancelled() }}
        run: scripts/ci.sh package

      - name: Tests – App auf macOS
        if: ${{ !cancelled() }}
        run: scripts/ci.sh macos

      - name: UI-Tests – macOS
        if: ${{ !cancelled() }}
        run: scripts/ci.sh ui

      - name: Build – iOS-Simulator
        if: ${{ !cancelled() }}
        run: scripts/ci.sh ios

      - name: Übersetzungen
        if: ${{ !cancelled() }}
        run: scripts/ci.sh strings

      # Ohne Logs und Testergebnisse, die nur zu diesem Lauf gehören.
      - name: Build-Cache speichern
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: rm -rf build/ci/DerivedData/Logs build/ci/DerivedData/Index.noindex

      - name: Build-Cache hochladen
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            build/ci/DerivedData
            build/ci/package-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # Bei einem Fehler: Logs und Testergebnisse (.xcresult, in Xcode zu öffnen) zum Herunterladen.
      - name: Logs hochladen
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            build/ci/*.log
            build/ci/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
