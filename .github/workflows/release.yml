# Veröffentlicht eine neue Version. Wird von Hand gestartet:
# GitHub → Actions → Release → Run workflow → Version und Plattform wählen.
#
# Voraussetzungen (siehe docs/Publishing.md und docs/CI.md):
#   - release-notes/<version>.md ist auf main committet
#   - SUPublicEDKey steht in NotifyAI-macOS-Info.plist
#   - Secret SPARKLE_ED_PRIVATE_KEY ist im Repository hinterlegt
#   - GitHub CLI (gh) ist auf dem Runner-Mac installiert
#   - Anmeldung bei Apple, eins von beiden:
#     a) Auf dem Runner-Mac: Developer-ID-Zertifikat im Schlüsselbund, Notarisierungs-Profil „NotifyAI-Notary“,
#        Apple-Account in Xcode. Der Runner läuft als dein Benutzer und nutzt deinen Schlüsselbund.
#     b) Secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (App-Store-Connect-API-Schlüssel, Rolle Admin).
#        Dann sind weder Zertifikat noch Profil im Schlüsselbund nötig.
#
# Ablauf: komplette CI →
#   macOS: scripts/release.sh --publish (notarisiertes DMG + ZIP im GitHub-Release, appcast.xml auf main)
#   iOS:   scripts/release-ios.sh (Upload zu App Store Connect; Einreichen zur Prüfung danach im Browser)

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version im Format 1.2.3'
        required: true
        type: string
      platform:
        description: 'Plattform'
        required: true
        type: choice
        default: 'macOS und iOS'
        options: ['macOS und iOS', 'nur macOS', 'nur iOS']

permissions:
  contents: write   # Tag, GitHub-Release und den appcast.xml-Commit erstellen

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    # Releases nur von main, damit appcast.xml dort landet, wo die App sie liest (SUFeedURL).
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          # release.sh nimmt die Anzahl der Commits als Build-Nummer. Ohne volle Historie wäre sie 1
          # und Sparkle würde neue Versionen nie als Update erkennen.
          fetch-depth: 0

      - name: Umgebung
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "CI_DERIVED_DATA=$HOME/Library/Developer/Xcode/DerivedData/NotifyAI-CI" >> "$GITHUB_ENV"
          xcodebuild -version
          /opt/homebrew/bin/gh --version | head -1

      # Secrets werden nur in Dateien unter $RUNNER_TEMP geschrieben und am Ende des Jobs gelöscht.
      - name: Schlüssel bereitstellen
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          umask 077
          if [[ "$PLATFORM" != "nur iOS" ]]; then
              if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
                  echo "::error::Secret SPARKLE_ED_PRIVATE_KEY fehlt (siehe docs/CI.md)."
                  exit 1
              fi
              printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          fi
          if [[ -n "$ASC_PRIVATE_KEY" ]]; then
              printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
              {
                  echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
                  echo "ASC_KEY_ID=$ASC_KEY_ID"
                  echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
              } >> "$GITHUB_ENV"
          fi

      # Schlägt in Sekunden fehl, wenn Zertifikat, Notarisierung oder Schlüssel fehlen – nicht erst nach der CI.
      - name: Voraussetzungen prüfen
        if: inputs.platform != 'nur iOS'
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/release.sh "$VERSION" --check --ed-key-file "$RUNNER_TEMP/sparkle_ed_key"

      - name: Prüfen (Lint, Tests, Builds)
        run: scripts/ci.sh

      - name: macOS – bauen, notarisieren und veröffentlichen
        if: inputs.platform != 'nur iOS'
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          scripts/release.sh "$VERSION" --publish --ed-key-file "$RUNNER_TEMP/sparkle_ed_key"

      - name: iOS – zu App Store Connect hochladen
        if: inputs.platform != 'nur macOS'
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/release-ios.sh "$VERSION"

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle_ed_key" "$RUNNER_TEMP/AuthKey.p8"
